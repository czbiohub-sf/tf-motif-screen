# Canonical DBD class -> native vocabulary terms in each resource, consumed by
# notebooks/04_database-and-applications/04_database-coverage.py.
#
# One entry per canonical class, and the entry order here is CANON_ORDER, which orders
# the coverage table. `interpro` lists the InterPro DBD accession(s) that anchor the
# class (from our own DNA-Binding==True interproscan annotations where available);
# `animaltfdb`, `jaspar_class`/`jaspar_family` and `cisbp` list the native vocabulary
# terms that map onto it.
#
# JASPAR is keyed on TFClass `class`, except where a class lumps distinct DBDs
# ("Tryptophan cluster factors", "Fork head/winged helix factors", HMG, Other-C4) --
# there we key on the finer `family` field instead.

zf-C2H2:
  interpro: [IPR013087]
  animaltfdb: [zf-C2H2, ZBTB]
  jaspar_class: [C2H2 zinc finger factors]
  cisbp: [C2H2 ZF, 'bZIP,C2H2 ZF', 'C2H2 ZF,Homeodomain']
zf-THAP:
  interpro: []
  animaltfdb: [THAP]
  jaspar_class: [C2CH THAP-type zinc finger factors]
  cisbp: [THAP finger]
zf-BED:
  interpro: [IPR003656]
  animaltfdb: [zf-BED]
  # JASPAR nests BED under its TFClass C2H2 class; pull it out via the finer family label.
  jaspar_family: [BED zinc finger factors]
  cisbp: [BED ZF]
zf-C2HC:
  interpro: []
  animaltfdb: [zf-C2HC]
  jaspar_class: [C2HC]
  cisbp: [C2HC ZF]
