[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "af3tfm"
dynamic = ["version"]
description = 'Predict transcription factor DNA-binding specificity (PPMs) from AlphaFold3 protein-DNA structures'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Benjamin Iovino", email = "benjamin.iovino@czbiohub.org" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "biopython",
    "logomaker",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "prody",
    "pyhmmer",
    "pyyaml",
    "requests",
    "scanpy",
    "scikit-learn",
    "scipy",
    "seaborn",
    "tqdm",
]

[project.optional-dependencies]
grn-plots = ["networkx==3.3", "adjustText==1.3.0"]

[tool.hatch.version]
path = "src/af3tfm/__about__.py"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's *default* selection grew substantially in
# 0.16 (C4, BLE, RUF, UP, S, ... all became default-on), which floods this repo
# with ~237 stylistic errors -- 65 of them C408 telling us to rewrite the
# dict(...) crosswalk tables as literals. Selecting explicitly keeps linting
# reproducible across ruff/editor-extension upgrades.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Newer ruff finds the src/ layout on its own and sorts af3tfm as first-party; the
# pre-commit hook's older ruff does not. Naming it keeps both versions agreeing.
known-first-party = ["af3tfm", "export_tools"]

[tool.coverage.run]
source_pkgs = ["af3tfm"]
branch = true
parallel = true
omit = [
  "src/af3tfm/__about__.py",
]

[tool.coverage.paths]
af3tfm = ["src/af3tfm", "*/af3-tf-motif/src/af3tfm"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/af3tfm"]
